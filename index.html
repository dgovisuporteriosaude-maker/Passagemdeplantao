<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos | Passagem de Plantão</title>

  <!-- Fonte tech -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --tech-accent: #00e0ff;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #1e3a5f, #0b1c2e 70%);
      color: #e6edf3;
      font-family: 'Inter', sans-serif;
    }

    /* GRID TECH FUNDO */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    h1, h2, h3 {
      font-family: 'Orbitron', sans-serif;
    }

    .page-wrap {
      max-width: 1280px;
      margin: auto;
      padding: 20px;
    }

    /* HEADER */
    .site-header {
      background: rgba(10, 25, 40, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
    }

    .logo-box img {
      max-height: 44px;
    }

    .top-nav {
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .top-nav-inner {
      display: flex;
      gap: 20px;
      padding: 10px 20px;
    }

    .nav-link {
      color: #9fb3c8;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-link.active {
      color: var(--tech-accent);
    }

    /* HERO */
    .notice-hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }

    .notice-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 30px rgba(0,224,255,0.08);
    }

    .notice-main-image {
      position: relative;
    }

    .notice-main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .notice-main-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.6), transparent);
    }

    .notice-main-content {
      padding: 24px;
    }

    .notice-tag {
      background: rgba(0,224,255,0.15);
      color: var(--tech-accent);
      padding: 6px 12px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .notice-btn {
      background: linear-gradient(90deg, #00e0ff, #00bcd4);
      color: #002b36;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
    }

    .notice-btn:hover {
      box-shadow: 0 0 12px rgba(0,224,255,0.6);
    }

    /* SIDE */
    .notice-side {
      display: grid;
      gap: 14px;
    }

    .mini-panel {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .mini-status-item {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 13px;
    }

    .mini-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0,224,255,0.15);
      color: var(--tech-accent);
      font-size: 12px;
    }

    /* CAROUSEL */
    .ticker-wrap {
      margin-top: 20px;
    }

    .ticker-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
    }

    .ticker-card {
      min-width: 260px;
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.2s;
    }

    .ticker-card:hover {
      transform: scale(1.03);
      border: 1px solid rgba(0,224,255,0.4);
    }

    .ticker-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .ticker-card-body {
      padding: 12px;
    }

    /* RESPONSIVO */
    @media (max-width: 900px) {
      .notice-hero {
        grid-template-columns: 1fr;
      }

      .notice-main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-box">
      <img src="assets/logo.png">
    </div>
    <div>
      <h1>Central de Comunicados</h1>
      <p>Atualizações operacionais em tempo real</p>
    </div>
  </div>

  <nav class="top-nav">
    <div class="top-nav-inner">
      <a href="#" class="nav-link active">Comunicados</a>
      <a href="#" class="nav-link">Passagem</a>
      <a href="#" class="nav-link">Insumos</a>
    </div>
  </nav>
</header>

<main class="page-wrap">
  <section id="avisosContainer"></section>
</main>

<script>
function renderAvisos(avisos) {
  const destaque = avisos[0];
  const outros = avisos.slice(1);

  document.getElementById('avisosContainer').innerHTML = `
    <section class="notice-hero">
      <div class="notice-main">
        <div class="notice-main-image">
          <img src="${destaque.imagem}">
        </div>
        <div class="notice-main-content">
          <span class="notice-tag">● SISTEMA</span>
          <h2>${destaque.titulo}</h2>
          <p>${destaque.mensagem}</p>
          <a class="notice-btn" href="${destaque.link_forms}" target="_blank">Confirmar ciência</a>
        </div>
      </div>

      <div class="notice-side">
        <div class="mini-panel">
          <h3>Status</h3>
          <div class="mini-status-item">
            <span>Total</span>
            <span class="mini-pill">${avisos.length}</span>
          </div>
        </div>
      </div>
    </section>

    <section class="ticker-wrap">
      <div class="ticker-track">
        ${outros.map(a => `
          <div class="ticker-card">
            <img src="${a.imagem}">
            <div class="ticker-card-body">
              <h4>${a.titulo}</h4>
              <p>${a.mensagem}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

fetch('./data/avisos.json')
  .then(r => r.json())
  .then(renderAvisos);
</script>

</body>
</html>
