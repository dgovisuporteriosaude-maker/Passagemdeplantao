<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos | Passagem de Plantão</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .logo-box img {
      max-height: 44px;
      width: auto;
    }

    .notice-hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      align-items: stretch;
    }

    .notice-main {
      background: linear-gradient(135deg, #173a5e, #274c73);
      color: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(23, 58, 94, 0.18);
      min-height: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .notice-main-image {
      background: rgba(255,255,255,0.08);
      min-height: 420px;
    }

    .notice-main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .notice-main-content {
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .notice-tag {
      display: inline-block;
      align-self: flex-start;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.16);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 7px 12px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .notice-main-content h2 {
      font-size: 30px;
      line-height: 1.12;
      margin-bottom: 12px;
    }

    .notice-date {
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      margin-bottom: 14px;
      font-weight: 700;
    }

    .notice-main-content p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.92);
      margin-bottom: 18px;
    }

    .notice-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      background: #ffffff;
      color: #173a5e;
      font-size: 14px;
      font-weight: 700;
      width: fit-content;
    }

    .notice-side {
      display: grid;
      gap: 14px;
    }

    .mini-panel {
      background: #ffffff;
      border: 1px solid #dbe3ec;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      padding: 18px;
    }

    .mini-panel h3 {
      font-size: 18px;
      color: #173a5e;
      margin-bottom: 8px;
    }

    .mini-panel p {
      color: #6b7a8c;
      font-size: 14px;
      line-height: 1.55;
    }

    .mini-status {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .mini-status-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e6edf5;
      font-size: 13px;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      height: 28px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .mini-pill.recent {
      background: rgba(67, 160, 71, 0.14);
      color: #2e7d32;
    }

    .mini-pill.total {
      background: rgba(23, 58, 94, 0.10);
      color: #173a5e;
    }

    .ticker-wrap {
      margin-top: 18px;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #dbe3ec;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      padding-bottom: 16px;
    }

    .ticker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #e8edf4;
      background: #f8fafc;
    }

    .ticker-head h3 {
      color: #173a5e;
      font-size: 18px;
    }

    .ticker-head span {
      color: #6b7a8c;
      font-size: 13px;
    }

    .notice-carousel {
      padding: 16px 14px 0;
    }

    .notice-carousel-viewport {
      overflow: hidden;
      width: 100%;
    }

    .ticker-track {
      display: flex;
      gap: 14px;
      width: max-content;
      transition: transform 0.45s ease;
      will-change: transform;
    }

    .ticker-card {
      width: 280px;
      flex: 0 0 auto;
      background: #ffffff;
      border: 1px solid #dbe3ec;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }

    .ticker-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #edf3f8;
    }

    .ticker-card-body {
      padding: 14px;
    }

    .ticker-card-body h4 {
      font-size: 15px;
      color: #173a5e;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .ticker-card-body .ticker-date {
      font-size: 12px;
      color: #6b7a8c;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .ticker-card-body p {
      color: #516273;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .ticker-card-body a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      background: #173a5e;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 999px;
      background: #c9d4df;
      cursor: pointer;
      transition: all 0.25s ease;
      padding: 0;
    }

    .carousel-dot.active {
      width: 24px;
      background: #173a5e;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .history-card {
      background: #ffffff;
      border: 1px solid #dbe3ec;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }

    .history-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #edf3f8;
    }

    .history-body {
      padding: 14px;
    }

    .history-body h4 {
      color: #173a5e;
      font-size: 16px;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .history-body .history-date {
      color: #6b7a8c;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .history-body p {
      color: #516273;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .history-body a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      background: #173a5e;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .empty-avisos {
      background: #fff;
      border: 1px dashed #cfd9e4;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      color: #6b7a8c;
    }

    @media (max-width: 1200px) {
      .notice-hero,
      .history-grid {
        grid-template-columns: 1fr;
      }

      .notice-main {
        grid-template-columns: 1fr;
      }

      .notice-main-image {
        min-height: 240px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-box">
        <img src="assets/logo.png" alt="Logo">
      </div>

      <div class="title-box">
        <h1>Comunicados internos - Suporte técnico DGOVI.</h1>
        <p>Painel interno de avisos, checklist operacional e controle de insumos</p>
      </div>
    </div>

    <nav class="top-nav">
      <div class="top-nav-inner">
        <a href="index.html" class="nav-link active">Comunicados</a>
        <a href="passagem.html" class="nav-link">Passagem de Plantão</a>
        <a href="insumos.html" class="nav-link">Insumos</a>
      </div>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="hero-card">
      <h2>Atenção</h2>
      <p>Antes de iniciar a passagem, verifique se há novos comunicados e registre a ciência dos avisos pendentes.</p>
    </section>

    <section id="avisosContainer"></section>
  </main>

  <script>
    let avisosInterval = null;

    function parseAvisoDate(value) {
      if (!value) return new Date(0);

      const isoLike = String(value).replace(' ', 'T');
      const direct = new Date(isoLike);
      if (!isNaN(direct)) return direct;

      const [datePart, timePart = '00:00'] = String(value).trim().split(' ');
      const [year, month, day] = datePart.includes('-')
        ? datePart.split('-').map(Number)
        : [0, 0, 0];

      const [hour = 0, minute = 0] = timePart.split(':').map(Number);
      if (!year || !month || !day) return new Date(0);

      return new Date(year, month - 1, day, hour, minute, 0);
    }

    function formatAvisoDate(value) {
      const d = parseAvisoDate(value);
      if (!d || isNaN(d)) return '-';
      return d.toLocaleString('pt-BR');
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setupCarousel() {
      const viewport = document.querySelector('.notice-carousel-viewport');
      const track = document.querySelector('.ticker-track');
      const dotsWrap = document.querySelector('.carousel-dots');

      if (!viewport || !track || !dotsWrap) return;

      const cards = Array.from(track.querySelectorAll('.ticker-card'));
      if (!cards.length) return;

      let currentIndex = 0;

      function getStep() {
        if (cards.length < 2) return cards[0]?.offsetWidth || 294;
        return cards[1].offsetLeft - cards[0].offsetLeft;
      }

      function getVisibleCount() {
        const step = getStep();
        return Math.max(1, Math.round(viewport.clientWidth / step));
      }

      function getMaxIndex() {
        return Math.max(0, cards.length - getVisibleCount());
      }

      function renderDots() {
        const total = getMaxIndex() + 1;
        dotsWrap.innerHTML = Array.from({ length: total }, (_, i) => `
          <button class="carousel-dot ${i === currentIndex ? 'active' : ''}" data-index="${i}" aria-label="Ir para posição ${i + 1}"></button>
        `).join('');

        dotsWrap.querySelectorAll('.carousel-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            currentIndex = Number(dot.dataset.index || 0);
            updateCarousel();
            restartAuto();
          });
        });
      }

      function updateCarousel() {
        const step = getStep();
        const maxIndex = getMaxIndex();
        if (currentIndex > maxIndex) currentIndex = 0;

        track.style.transform = `translateX(-${currentIndex * step}px)`;

        dotsWrap.querySelectorAll('.carousel-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === currentIndex);
        });
      }

      function nextSlide() {
        const maxIndex = getMaxIndex();
        currentIndex = currentIndex >= maxIndex ? 0 : currentIndex + 1;
        updateCarousel();
      }

      function startAuto() {
        if ((getMaxIndex() + 1) <= 1) return;
        avisosInterval = setInterval(nextSlide, 4000);
      }

      function stopAuto() {
        if (avisosInterval) {
          clearInterval(avisosInterval);
          avisosInterval = null;
        }
      }

      function restartAuto() {
        stopAuto();
        startAuto();
      }

      renderDots();
      updateCarousel();
      startAuto();

      viewport.addEventListener('mouseenter', stopAuto);
      viewport.addEventListener('mouseleave', startAuto);

      window.addEventListener('resize', () => {
        renderDots();
        updateCarousel();
      });
    }

    function renderAvisos(avisos) {
      const container = document.getElementById('avisosContainer');

      if (!avisos.length) {
        container.innerHTML = `
          <div class="empty-avisos">
            Nenhum aviso encontrado em <strong>data/avisos.json</strong>.
          </div>
        `;
        return;
      }

      const sorted = [...avisos].sort((a, b) => parseAvisoDate(b.data) - parseAvisoDate(a.data));
      const destaque = sorted[0];
      const restantes = sorted.slice(1);

      container.innerHTML = `
        <section class="notice-hero">
          <article class="notice-main">
            <div class="notice-main-image">
              <img src="${escapeHtml(destaque.imagem)}" alt="${escapeHtml(destaque.titulo)}">
            </div>

            <div class="notice-main-content">
              <span class="notice-tag">Aviso mais recente</span>
              <div class="notice-date">${formatAvisoDate(destaque.data)}</div>
              <h2>${escapeHtml(destaque.titulo)}</h2>
              <p>${escapeHtml(destaque.mensagem)}</p>
              <a class="notice-btn" href="${escapeHtml(destaque.link_forms)}" target="_blank" rel="noopener noreferrer">
                Confirmar ciência
              </a>
            </div>
          </article>

          <aside class="notice-side">
            <div class="mini-panel">
              <h3>Painel de comunicados</h3>
              <p>Os avisos ficam centralizados aqui, com destaque para o comunicado mais recente e confirmação individual de ciência.</p>

              <div class="mini-status">
                <div class="mini-status-item">
                  <span>Total de avisos</span>
                  <span class="mini-pill total">${sorted.length}</span>
                </div>
                <div class="mini-status-item">
                  <span>Última atualização</span>
                  <span class="mini-pill recent">${formatAvisoDate(destaque.data)}</span>
                </div>
              </div>
            </div>

            <div class="mini-panel">
              <h3>Orientação</h3>
              <p>Ao abrir um aviso, o colaborador deve acessar o link correspondente e registrar a ciência no formulário indicado.</p>
            </div>
          </aside>
        </section>

        ${restantes.length ? `
          <section class="ticker-wrap">
            <div class="ticker-head">
              <h3>Comunicados anteriores</h3>
              <span>Passe o mouse para pausar a faixa</span>
            </div>

            <div class="notice-carousel">
              <div class="notice-carousel-viewport">
                <div class="ticker-track">
                  ${restantes.map(item => `
                    <article class="ticker-card">
                      <img src="${escapeHtml(item.imagem)}" alt="${escapeHtml(item.titulo)}">
                      <div class="ticker-card-body">
                        <div class="ticker-date">${formatAvisoDate(item.data)}</div>
                        <h4>${escapeHtml(item.titulo)}</h4>
                        <p>${escapeHtml(item.mensagem)}</p>
                        <a href="${escapeHtml(item.link_forms)}" target="_blank" rel="noopener noreferrer">Confirmar ciência</a>
                      </div>
                    </article>
                  `).join('')}
                </div>
              </div>

              <div class="carousel-dots"></div>
            </div>
          </section>
        ` : ''}
      `;

      if (avisosInterval) {
        clearInterval(avisosInterval);
        avisosInterval = null;
      }

      if (restantes.length) {
        setupCarousel();
      }
    }

    async function loadAvisos() {
      const response = await fetch('./data/avisos.json?_=' + Date.now());
      if (!response.ok) throw new Error('Não foi possível carregar os avisos.');

      const avisos = await response.json();
      renderAvisos(Array.isArray(avisos) ? avisos : []);
    }

    loadAvisos().catch(error => {
      document.getElementById('avisosContainer').innerHTML = `
        <div class="empty-avisos">
          Erro ao carregar os avisos: ${escapeHtml(error.message)}
        </div>
      `;
    });
  </script>
</body>
</html>
