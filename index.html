<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos | Passagem de Plantão</title>
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    .logo-box img {
      max-height: 44px;
      width: auto;
    }

    .notice-hero {
      display: block;
    }

    .notice-main {
      background:
        linear-gradient(135deg, rgba(23, 58, 94, 0.96), rgba(39, 76, 115, 0.93)),
        radial-gradient(circle at top right, rgba(255,255,255,0.12), transparent 35%);
      color: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(23, 58, 94, 0.18);
      min-height: 460px;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .notice-main-image {
      position: relative;
      min-height: 460px;
      background: rgba(255,255,255,0.06);
    }

    .notice-main-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(9, 20, 34, 0.08) 0%, rgba(9, 20, 34, 0.34) 100%);
      pointer-events: none;
    }

    .notice-main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .notice-main-content {
      padding: 34px 34px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    .notice-tag {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 8px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.16);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      border-radius: 999px;
      padding: 8px 14px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      backdrop-filter: blur(4px);
    }

    .notice-main-content h2 {
      font-size: clamp(30px, 3vw, 42px);
      line-height: 1.08;
      margin: 0 0 14px;
      letter-spacing: -0.02em;
    }

    .notice-date {
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      margin-bottom: 14px;
      font-weight: 700;
    }

    .notice-main-content p {
      font-size: 15px;
      line-height: 1.72;
      color: rgba(255,255,255,0.92);
      margin: 0 0 22px;
      max-width: 620px;
    }

    .notice-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .notice-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 12px;
      background: #ffffff;
      color: #173a5e;
      font-size: 14px;
      font-weight: 800;
      width: fit-content;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .notice-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.2);
    }

    .notice-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: auto;
    }

    .notice-meta-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(5px);
    }

    .notice-meta-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .notice-meta-value {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.4;
    }

    .ticker-wrap {
      margin-top: 22px;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid #dbe3ec;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      padding-bottom: 16px;
    }

    .ticker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid #e8edf4;
      background: linear-gradient(180deg, #fbfcfe 0%, #f6f9fc 100%);
    }

    .ticker-head h3 {
      color: #173a5e;
      font-size: 19px;
      margin: 0;
    }

    .ticker-head span {
      color: #6b7a8c;
      font-size: 13px;
      font-weight: 500;
    }

    .notice-carousel {
      padding: 18px 16px 0;
    }

    .notice-carousel-viewport {
      overflow: hidden;
      width: 100%;
    }

    .ticker-track {
      display: flex;
      gap: 16px;
      width: max-content;
      transition: transform 0.45s ease;
      will-change: transform;
    }

    .ticker-card {
      width: 300px;
      flex: 0 0 auto;
      background: #ffffff;
      border: 1px solid #dbe3ec;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .ticker-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .ticker-card img {
      width: 100%;
      height: 164px;
      object-fit: cover;
      display: block;
      background: #edf3f8;
    }

    .ticker-card-body {
      padding: 16px;
    }

    .ticker-card-body h4 {
      font-size: 16px;
      color: #173a5e;
      margin: 0 0 8px;
      line-height: 1.35;
    }

    .ticker-card-body .ticker-date {
      font-size: 12px;
      color: #6b7a8c;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .ticker-card-body p {
      color: #516273;
      font-size: 13px;
      line-height: 1.52;
      margin: 0 0 14px;
    }

    .ticker-card-body a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 13px;
      border-radius: 10px;
      background: #173a5e;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 999px;
      background: #c9d4df;
      cursor: pointer;
      transition: all 0.25s ease;
      padding: 0;
    }

    .carousel-dot.active {
      width: 24px;
      background: #173a5e;
    }

    .empty-avisos {
      background: #fff;
      border: 1px dashed #cfd9e4;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      color: #6b7a8c;
    }

    @media (max-width: 1200px) {
      .notice-main {
        grid-template-columns: 1fr;
      }

      .notice-main-image {
        min-height: 260px;
      }

      .notice-main-content {
        padding: 28px 24px 24px;
      }
    }

    @media (max-width: 720px) {
      .notice-main {
        min-height: auto;
      }

      .notice-meta {
        grid-template-columns: 1fr;
      }

      .ticker-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .ticker-card {
        width: 280px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-box">
        <img src="assets/logo.png" alt="Logo">
      </div>

      <div class="title-box">
        <h1>Comunicados internos - Suporte técnico DGOVI.</h1>
        <p>Painel interno de avisos, checklist operacional e controle de insumos</p>
      </div>
    </div>

    <nav class="top-nav">
      <div class="top-nav-inner">
        <a href="index.html" class="nav-link active">Comunicados</a>
        <a href="passagem.html" class="nav-link">Passagem de Plantão</a>
        <a href="insumos.html" class="nav-link">Insumos</a>
      </div>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="hero-card">
      <h2>Atenção</h2>
      <p>Antes de iniciar a passagem, verifique se há novos comunicados e registre a ciência dos avisos pendentes.</p>
    </section>

    <section id="avisosContainer"></section>
  </main>

  <script>
    let avisosInterval = null;

    function parseAvisoDate(value) {
      if (!value) return new Date(0);

      const isoLike = String(value).replace(' ', 'T');
      const direct = new Date(isoLike);
      if (!isNaN(direct)) return direct;

      const [datePart, timePart = '00:00'] = String(value).trim().split(' ');
      const [year, month, day] = datePart.includes('-')
        ? datePart.split('-').map(Number)
        : [0, 0, 0];

      const [hour = 0, minute = 0] = timePart.split(':').map(Number);
      if (!year || !month || !day) return new Date(0);

      return new Date(year, month - 1, day, hour, minute, 0);
    }

    function formatAvisoDate(value) {
      const d = parseAvisoDate(value);
      if (!d || isNaN(d)) return '-';
      return d.toLocaleString('pt-BR');
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setupCarousel() {
      const viewport = document.querySelector('.notice-carousel-viewport');
      const track = document.querySelector('.ticker-track');
      const dotsWrap = document.querySelector('.carousel-dots');

      if (!viewport || !track || !dotsWrap) return;

      const cards = Array.from(track.querySelectorAll('.ticker-card'));
      if (!cards.length) return;

      let currentIndex = 0;

      function getStep() {
        if (cards.length < 2) return cards[0]?.offsetWidth || 316;
        return cards[1].offsetLeft - cards[0].offsetLeft;
      }

      function getVisibleCount() {
        const step = getStep();
        return Math.max(1, Math.round(viewport.clientWidth / step));
      }

      function getMaxIndex() {
        return Math.max(0, cards.length - getVisibleCount());
      }

      function renderDots() {
        const total = getMaxIndex() + 1;
        dotsWrap.innerHTML = Array.from({ length: total }, (_, i) => `
          <button class="carousel-dot ${i === currentIndex ? 'active' : ''}" data-index="${i}" aria-label="Ir para posição ${i + 1}"></button>
        `).join('');

        dotsWrap.querySelectorAll('.carousel-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            currentIndex = Number(dot.dataset.index || 0);
            updateCarousel();
            restartAuto();
          });
        });
      }

      function updateCarousel() {
        const step = getStep();
        const maxIndex = getMaxIndex();
        if (currentIndex > maxIndex) currentIndex = 0;

        track.style.transform = `translateX(-${currentIndex * step}px)`;

        dotsWrap.querySelectorAll('.carousel-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === currentIndex);
        });
      }

      function nextSlide() {
        const maxIndex = getMaxIndex();
        currentIndex = currentIndex >= maxIndex ? 0 : currentIndex + 1;
        updateCarousel();
      }

      function startAuto() {
        if ((getMaxIndex() + 1) <= 1) return;
        avisosInterval = setInterval(nextSlide, 4000);
      }

      function stopAuto() {
        if (avisosInterval) {
          clearInterval(avisosInterval);
          avisosInterval = null;
        }
      }

      function restartAuto() {
        stopAuto();
        startAuto();
      }

      renderDots();
      updateCarousel();
      startAuto();

      viewport.addEventListener('mouseenter', stopAuto);
      viewport.addEventListener('mouseleave', startAuto);

      window.addEventListener('resize', () => {
        renderDots();
        updateCarousel();
      });
    }

    function renderAvisos(avisos) {
      const container = document.getElementById('avisosContainer');

      if (!avisos.length) {
        container.innerHTML = `
          <div class="empty-avisos">
            Nenhum aviso encontrado em <strong>data/avisos.json</strong>.
          </div>
        `;
        return;
      }

      const sorted = [...avisos].sort((a, b) => parseAvisoDate(b.data) - parseAvisoDate(a.data));
      const destaque = sorted[0];
      const restantes = sorted.slice(1);

      container.innerHTML = `
        <section class="notice-hero">
          <article class="notice-main">
            <div class="notice-main-image">
              <img src="${escapeHtml(destaque.imagem)}" alt="${escapeHtml(destaque.titulo)}">
            </div>

            <div class="notice-main-content">
              <span class="notice-tag">Aviso mais recente</span>
              <div class="notice-date">${formatAvisoDate(destaque.data)}</div>
              <h2>${escapeHtml(destaque.titulo)}</h2>
              <p>${escapeHtml(destaque.mensagem)}</p>

              <div class="notice-actions">
                <a class="notice-btn" href="${escapeHtml(destaque.link_forms)}" target="_blank" rel="noopener noreferrer">
                  Confirmar ciência
                </a>
              </div>

              <div class="notice-meta">
                <div class="notice-meta-card">
                  <span class="notice-meta-label">Total de comunicados</span>
                  <span class="notice-meta-value">${sorted.length}</span>
                </div>
                <div class="notice-meta-card">
                  <span class="notice-meta-label">Última atualização</span>
                  <span class="notice-meta-value">${formatAvisoDate(destaque.data)}</span>
                </div>
              </div>
            </div>
          </article>
        </section>

        ${restantes.length ? `
          <section class="ticker-wrap">
            <div class="ticker-head">
              <h3>Comunicados anteriores</h3>
              <span>Passe o mouse para pausar a faixa</span>
            </div>

            <div class="notice-carousel">
              <div class="notice-carousel-viewport">
                <div class="ticker-track">
                  ${restantes.map(item => `
                    <article class="ticker-card">
                      <img src="${escapeHtml(item.imagem)}" alt="${escapeHtml(item.titulo)}">
                      <div class="ticker-card-body">
                        <div class="ticker-date">${formatAvisoDate(item.data)}</div>
                        <h4>${escapeHtml(item.titulo)}</h4>
                        <p>${escapeHtml(item.mensagem)}</p>
                        <a href="${escapeHtml(item.link_forms)}" target="_blank" rel="noopener noreferrer">Confirmar ciência</a>
                      </div>
                    </article>
                  `).join('')}
                </div>
              </div>

              <div class="carousel-dots"></div>
            </div>
          </section>
        ` : ''}
      `;

      if (avisosInterval) {
        clearInterval(avisosInterval);
        avisosInterval = null;
      }

      if (restantes.length) {
        setupCarousel();
      }
    }

    async function loadAvisos() {
      const response = await fetch('./data/avisos.json?_=' + Date.now());
      if (!response.ok) throw new Error('Não foi possível carregar os avisos.');

      const avisos = await response.json();
      renderAvisos(Array.isArray(avisos) ? avisos : []);
    }

    loadAvisos().catch(error => {
      document.getElementById('avisosContainer').innerHTML = `
        <div class="empty-avisos">
          Erro ao carregar os avisos: ${escapeHtml(error.message)}
        </div>
      `;
    });
  </script>
</body>
</html>
